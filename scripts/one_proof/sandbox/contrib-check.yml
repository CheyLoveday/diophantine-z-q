# The discharge check of an outside contribution. This file runs only in the throwaway sandbox repository:
# prepare_commit.sh copies it to .github/workflows/contrib-check.yml of each prepared commit, as the only
# workflow there, and the commit is pushed to a scratch/ branch of the sandbox. It builds outside code, so
# it holds no secrets, its token can only read, and checkout leaves no credentials in .git/config. See
# scripts/one_proof/sandbox/README.md.
#
# A scratch/measure-* branch (a commit from prepare_commit.sh --measure) measures the cold build of
# +ZInQKernel.OneProof.Main instead, with no contribution. The measurement is chosen by branch name, since a
# workflow_dispatch trigger needs the workflow on the default branch, and the sandbox's main has no .github.

name: contrib check

on:
  push:
    branches: ['scratch/**']

permissions:
  contents: read

jobs:
  check:
    name: discharge check
    runs-on: ubuntu-latest
    # The hosted maximum: a cold build of the OneProof target is long.
    timeout-minutes: 360
    steps:
      - name: Free disk space and add swap
        run: |
          set -euo pipefail
          df -h / /mnt || true
          free -h
          # Large preinstalled toolchains this job does not use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          # Swap as large as the disk allows: on /mnt when the runner has a separate temporary disk,
          # otherwise on / with 30 GB kept free for Mathlib and the build.
          if mountpoint -q /mnt; then dir=/mnt; keep=2; else dir=; keep=30; fi
          avail="$(df --output=avail -BG "${dir:-/}" | tail -n 1 | tr -dc '0-9')"
          size=$((avail - keep))
          if [ "$size" -ge 1 ]; then
            sudo fallocate -l "${size}G" "$dir/swapfile"
            sudo chmod 600 "$dir/swapfile"
            sudo mkswap "$dir/swapfile"
            sudo swapon "$dir/swapfile"
          fi
          free -h
          df -h / /mnt || true

      - name: Check out the prepared commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Measure the cold build of the OneProof target
        if: startsWith(github.ref_name, 'scratch/measure-')
        run: bash scripts/one_proof/sandbox/discharge_check.sh measure

      - name: Build the contribution
        if: ${{ !startsWith(github.ref_name, 'scratch/measure-') }}
        run: bash scripts/one_proof/sandbox/discharge_check.sh build

      # The nonce is made here, after the build, and only this step sees it, so a line printed by build-time
      # code cannot carry it.
      - name: Run the trusted reporter
        if: ${{ !cancelled() && !startsWith(github.ref_name, 'scratch/measure-') }}
        run: |
          set -euo pipefail
          DISCHARGE_NONCE="$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')"
          export DISCHARGE_NONCE
          bash scripts/one_proof/sandbox/discharge_check.sh report

      - name: Upload the log and the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contrib-check
          path: .sandbox/out
          include-hidden-files: true
          if-no-files-found: warn
