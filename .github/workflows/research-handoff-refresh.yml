name: Build November 6 research handoff revision 3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-handoff-2026-11-06-r3
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'elliotglazer/diophantine-z-q'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check the research and freeze the snapshot
        shell: bash
        run: |
          ulimit -v 2097152
          mkdir -p build
          python -E -B research/2026-11-06-collaborator-notes/check_replacement.py > build/research-checks.json
          python -E -B handoff/test_handoff.py > build/handoff-tests.json
          python -E -B handoff/prepare_handoff.py --repo . --commit "$GITHUB_SHA" --verification-receipt docs/quartic-4973-validation/REPRODUCTION.json --output build/handoff-plan.json
      - name: Fetch the unchanged historical baseline
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/baseline.zip" https://github.com/elliotglazer/diophantine-z-q/releases/download/research-handoff-2026-11-04-r2/z-in-q-research-handoff-2026-11-04-r2.zip
          printf '827765f17087e1794c15770221a3a2d0fefed25839566a4a9bfb3b5aaa1ed42b  %s\n' "$RUNNER_TEMP/baseline.zip" | sha256sum --check -
      - name: Build and verify both archives
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B handoff/build_handoff.py --repo . --payload handoff/payload --plan build/handoff-plan.json --baseline "$RUNNER_TEMP/baseline.zip" --output build/handoff-output
          python -E -B handoff/verify_handoff.py build/handoff-output/z-in-q-version4-current-handoff.zip --extract "$RUNNER_TEMP/current-handoff-extracted" > build/handoff-extraction.json
          python -E -B "$RUNNER_TEMP/current-handoff-extracted/current/research/2026-11-06-collaborator-notes/check_replacement.py" > build/extracted-research-checks.json
      - name: Create the research draft without replacing Version 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=research-handoff-2026-11-06-r3
          if ! tag_record=$(git ls-remote --refs origin "refs/tags/$tag"); then
            printf '%s\n' 'Could not check the remote tag.' >&2
            exit 1
          fi
          if [ -n "$tag_record" ] || gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' 'Research release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title 'Research handoff: November 6, revision 3' --notes-file handoff/RESEARCH_UPDATE_NOTES.md build/handoff-output/z-in-q-version4-full-handoff.zip build/handoff-output/z-in-q-version4-current-handoff.zip build/handoff-output/SHA256SUMS build/handoff-output/BUILD_RECEIPT.json build/handoff-plan.json build/research-checks.json build/extracted-research-checks.json build/handoff-tests.json build/handoff-extraction.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-handoff-r3-evidence
          path: |
            build/*.json
            build/handoff-output/BUILD_RECEIPT.json
            build/handoff-output/SHA256SUMS
