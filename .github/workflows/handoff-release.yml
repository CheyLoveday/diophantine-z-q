name: Build Version 2 research handoff

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quartic-12504-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'elliotglazer/diophantine-z-q'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check packaging and freeze exact snapshot
        shell: bash
        run: |
          ulimit -v 2097152
          mkdir -p build
          python -E -B handoff/test_handoff.py > build/handoff-tests.json
          python -E -B handoff/prepare_handoff.py --repo . --commit "$GITHUB_SHA" --verification-receipt docs/quartic-12504/verification/REPRODUCTION.json --output build/handoff-plan.json
      - name: Fetch unchanged historical baseline
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/baseline.zip" https://github.com/elliotglazer/diophantine-z-q/releases/download/research-handoff-2026-11-04-r2/z-in-q-research-handoff-2026-11-04-r2.zip
          printf '827765f17087e1794c15770221a3a2d0fefed25839566a4a9bfb3b5aaa1ed42b  %s\n' "$RUNNER_TEMP/baseline.zip" | sha256sum --check -
      - name: Build and verify both handoffs
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B handoff/build_handoff.py --repo . --payload handoff/payload --plan build/handoff-plan.json --baseline "$RUNNER_TEMP/baseline.zip" --output build/handoff-output
          python -E -B handoff/verify_handoff.py build/handoff-output/z-in-q-version2-current-handoff.zip --extract "$RUNNER_TEMP/current-handoff-extracted" > build/handoff-extraction.json
          sha256sum quartic_12504.tex quartic_12504.pdf >> build/handoff-output/SHA256SUMS
      - name: Upload a draft release for final inspection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view quartic-12504-version-2 >/dev/null 2>&1; then
            printf '%s\n' 'Release tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create quartic-12504-version-2 --target "$GITHUB_SHA" --draft --title 'Version 2: the 12,504-variable quartic' --notes-file handoff/RELEASE_NOTES.md quartic_12504.tex quartic_12504.pdf build/handoff-output/z-in-q-version2-full-handoff.zip build/handoff-output/z-in-q-version2-current-handoff.zip build/handoff-output/SHA256SUMS build/handoff-output/BUILD_RECEIPT.json build/handoff-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: version2-handoff-evidence
          path: |
            build/handoff-plan.json
            build/handoff-tests.json
            build/handoff-extraction.json
            build/handoff-output/BUILD_RECEIPT.json
            build/handoff-output/SHA256SUMS
