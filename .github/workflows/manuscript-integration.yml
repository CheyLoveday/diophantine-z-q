name: Version 2 manuscript and quartic verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'quartic_12504.tex'
      - 'quartics/quartic-12504/**'
      - 'docs/quartic-12504/**'
      - 'scripts/build_paper.py'
      - '.github/workflows/manuscript-integration.yml'

permissions:
  contents: read

concurrency:
  group: quartic-12504-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/tectonic
          key: tectonic-${{ runner.os }}-0.17.0-6ffe055852f8faf66
      - name: Reproduce source, certificate, and full integer expansion
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B quartics/quartic-12504/reproducibility/run.py --output build/quartic-reproduction --stage-seconds 180
      - name: Check historical audit and current manuscript bindings
        run: |
          python docs/theorem-application-audit/validate.py
          python docs/quartic-12504/validate.py
      - name: Compile the exact Version 2 manuscript
        run: python scripts/build_paper.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-12504-release-checks
          path: |
            build/quartic-reproduction/
            build/quartic-inventory.json
            build/paper/
