name: Version 3 manuscript and quartic verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run all verification, rebuild paper, or render committed PDF'
        type: choice
        options: [all, paper, visual]
        default: all
  push:
    paths:
      - 'quartic_9625.tex'
      - 'quartics/quartic-9625/**'
      - 'docs/quartic-9625/**'
      - 'scripts/build_paper.py'
      - '.github/workflows/manuscript-integration.yml'

permissions:
  contents: read

concurrency:
  group: quartic-9625-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/tectonic
          key: tectonic-${{ runner.os }}-0.17.0-6ffe055852f8faf66
      - name: Reproduce source, certificate, and full integer expansion
        if: inputs.mode != 'visual' && inputs.mode != 'paper'
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B quartics/quartic-9625/reproducibility/run.py --output build/quartic-reproduction --stage-seconds 180
      - name: Check historical audit and current manuscript bindings
        if: inputs.mode != 'visual' && inputs.mode != 'paper'
        run: |
          python docs/theorem-application-audit/validate.py
          python docs/quartic-9625/validate.py
      - name: Compile the exact Version 3 manuscript
        if: inputs.mode != 'visual'
        run: python scripts/build_paper.py
      - name: Render the manuscript for visual review
        if: inputs.mode == 'visual' || inputs.mode == 'paper'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          ulimit -v 2097152
          if [ "${{ inputs.mode }}" = paper ]; then
            python scripts/render_quartic_review.py --pdf build/paper/quartic_9625.pdf
          else
            python scripts/render_quartic_review.py
          fi
      - name: Validate the handoff snapshot before publication
        if: inputs.mode == 'visual'
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B handoff/test_handoff.py > build/handoff-tests.json
          python -E -B handoff/prepare_handoff.py --repo . --commit "$GITHUB_SHA" --verification-receipt docs/quartic-9625/verification/REPRODUCTION.json --output build/prepublication-handoff-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-9625-release-checks
          path: |
            build/quartic-reproduction/
            build/quartic-inventory.json
            build/paper/
            build/pdf-review/
            build/handoff-tests.json
            build/prepublication-handoff-plan.json
