name: Version 4 manuscript and quartic verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate the selected source and manuscript'
        type: choice
        options: [all, reproduction, paper]
        default: all

permissions:
  contents: read

concurrency:
  group: quartic-4973-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduction:
    if: inputs.mode != 'paper'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Rebuild source and replay the complete selected certificate
        shell: bash
        run: |
          ulimit -v 2097152
          python -E -B quartics/quartic-4973/reproducibility/run.py --output build/quartic-reproduction --stage-seconds 180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-4973-reproduction
          path: build/quartic-reproduction/
  paper:
    if: inputs.mode != 'reproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/tectonic
          key: tectonic-${{ runner.os }}-0.17.0-6ffe055852f8faf66
      - name: Compile the exact Version 4 manuscript
        run: python scripts/build_paper.py
      - name: Render changed pages for visual review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          ulimit -v 2097152
          python scripts/render_quartic_review.py --pdf build/paper/quartic_4973.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-4973-paper
          path: |
            build/paper/
            build/pdf-review/
