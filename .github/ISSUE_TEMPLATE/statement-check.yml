name: Statement check report
description: Report a check of one open Lean statement against its printed source (no Lean needed).
title: "Statement check: <field>"
labels: ["no Lean needed"]
body:
  - type: markdown
    attributes:
      value: |
        One report per statement. The rules are in docs/one-proof/STATEMENT-CHECKS.md. A reading counts as a
        human reading only if it states AI use and quotes the printed statement verbatim, with edition and page.
        If you claimed a packet, you may post the same fields as a comment in the thread where you claimed it instead.
  - type: input
    id: field
    attributes:
      label: Field
      description: The Lean field name exactly as OPEN.md shows it.
      placeholder: sga7_IX_3_3
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit of OPEN.md you read.
    validations:
      required: true
  - type: dropdown
    id: packet
    attributes:
      label: Packet
      description: The reading packet, from OPEN.md's Packets section (each hypothesis entry also names its packet). Choose other if the statement is in none of these.
      options:
        - R1
        - R2
        - R3
        - R4
        - R5
        - R6
        - R7
        - R10
        - other
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Edition
      description: The edition you read (publisher, year, printing or version).
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display
      description: The theorem, proposition or display number.
    validations:
      required: true
  - type: dropdown
    id: copy
    attributes:
      label: Copy
      options:
        - library print
        - author copy
        - scan
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Quote
      description: A short verbatim quote of the printed statement, enough that a second reader with the same edition can check it.
    validations:
      required: true
  - type: textarea
    id: standing_hypotheses
    attributes:
      label: Standing hypotheses
      description: Conventions from the chapter or section head (base ring or scheme, finiteness assumptions, normalizations).
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Comparison
      description: Clause by clause, the print against the Lean. Quantifier order, base ring, boundary cases, constants.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      options:
        - "YES"
        - "CONSEQUENCE"
        - "NO-statement"
        - "NO-locator"
        - "UNVERIFIED"
    validations:
      required: true
  - type: textarea
    id: verdict_detail
    attributes:
      label: Step, right locator or reason
      description: For CONSEQUENCE, name the further step. For NO-locator, give the right place if you know it. For UNVERIFIED, say why.
    validations:
      required: false
  - type: dropdown
    id: no_kind
    attributes:
      label: For a NO, false, incomplete or unclear
      description: Whether the Lean statement is false, only not justified by this source, or the source is unclear.
      options:
        - "Not applicable (the verdict is not a NO)"
        - "false"
        - "incomplete"
        - "unclear"
    validations:
      required: true
  - type: textarea
    id: not_read
    attributes:
      label: Not read
      description: What you did not read (other sections, the proof, cited lemmas).
    validations:
      required: true
  - type: textarea
    id: ai_use
    attributes:
      label: AI use
      description: 'Write "none", or say which tool did what. Readings produced by a tool are recorded as AI-READ and do not clear a flag.'
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence
      description: HUMAN-READ only if you read the print yourself and the quote and comparison are your own. A reading a tool produced is AI-READ; it is recorded but never counts as a human reading.
      options:
        - "HUMAN-READ: I read the print myself"
        - "AI-READ: a tool produced the reading"
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit
      description: How to credit you, if not by your GitHub handle (a pseudonym is fine).
    validations:
      required: false
