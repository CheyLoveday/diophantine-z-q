name: Question
description: Ask a question about the open statements, the checks or how to contribute.
title: "Question: "
body:
  - type: markdown
    attributes:
      value: |
        Questions about the mathematics of one statement can also go to the area issue linked in its OPEN.md row.
        Claims go on issue 14, not here.
  - type: input
    id: field
    attributes:
      label: Field
      description: The Lean field name, if the question is about one statement.
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
