name: Statement bug
description: Report an open Lean statement that is false, vacuous or stronger than its source, with a corrected statement.
title: "Statement bug: <field>"
labels: ["statement bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never change a statement to make it provable: report it here instead. A statement shown to be false,
        vacuous or stronger than its source, with a corrected version, is a credited result.
  - type: input
    id: field
    attributes:
      label: Field
      description: The Lean field name exactly as OPEN.md shows it.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit you read.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - "false"
        - "vacuous"
        - "stronger than its source"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Edition, page and display of the printed statement, with a short verbatim quote, if the problem is a mismatch with the source.
    validations:
      required: false
  - type: textarea
    id: explanation
    attributes:
      label: Explanation
      description: The counterexample, the reason it is vacuous, or the clause that is stronger than the print.
    validations:
      required: true
  - type: textarea
    id: corrected
    attributes:
      label: Corrected statement
      description: The statement as it should read, in Lean or in words.
    validations:
      required: true
  - type: textarea
    id: ai_use
    attributes:
      label: AI use
      description: 'Write "none", or say which tool did what. A comparison with the print that a tool produced is recorded as AI-READ and never counts as a human reading.'
    validations:
      required: true
